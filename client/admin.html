<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EdMetric</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#137fec',
                        'background-light': '#f6f7f8',
                        'background-dark': '#101922',
                    },
                    fontFamily: { display: ['Lexend', 'sans-serif'] },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-[#111418] dark:text-white flex items-center justify-center min-h-screen">

    <div class="bg-white dark:bg-[#283039] p-10 rounded-xl shadow-xl w-full max-w-md">
        <div class="text-center mb-6">
            <span class="material-symbols-outlined text-primary text-4xl">school</span>
            <h1 class="text-3xl font-bold mt-2">Welcome Back</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">Enter your credentials to access the dashboard</p>
        </div>

        <form class="flex flex-col gap-4">
            <!-- Email -->
            <input type="text" placeholder="Email or Username"
                class="p-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#1c252e] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">

            <!-- Password -->
            <input type="password" placeholder="Password"
                class="p-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#1c252e] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">

            <!-- Sign In Button -->
            <button type="button" id="signinBtn"
                class="w-full py-3 bg-primary text-white rounded-lg font-bold hover:bg-blue-600 transition-colors shadow-lg">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
            Don't have an account? <a href="#" class="text-primary font-bold hover:underline">Contact Admin</a>
        </p>
    </div>

    <!-- JS -->
    <script>
        // Wait for DOM to load
        window.addEventListener('DOMContentLoaded', () => {
            const signinBtn = document.getElementById('signinBtn');
            signinBtn.addEventListener('click', () => {
                console.log("Sign In clicked"); // Debug
                // Navigate to dashboard page
                window.location.href = 'admin-dashboard.html';
            });
        });
    </script>
</body>

</html>
